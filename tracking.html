<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>Order Tracking | TESLA Innovation</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08090b;color:#fff;font-family:Arial,sans-serif;line-height:1.6}
header{padding:20px 6%;background:#111;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.logo{font-weight:900;letter-spacing:2px;font-size:20px}
.logo span{color:#e82127}
a{color:#e82127;text-decoration:none}
header a{font-size:13px;color:#ddd}
main{max-width:950px;width:92%;margin:40px auto}
h1{font-size:30px;margin:8px 0}
.sub{color:#999;font-size:14px;margin-bottom:25px}
.card{background:#121418;border:1px solid #30343b;border-radius:10px;padding:23px;margin-bottom:20px}
.order{border:1px solid #333;background:#181a1f;border-radius:8px;padding:20px;margin-top:16px}
.order h2{font-size:20px;margin-bottom:12px}
.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.detail{background:#101216;padding:12px;border-radius:6px;overflow-wrap:anywhere}
.detail small{display:block;color:#999;font-size:11px}
.detail strong{font-size:13px}
.badge{display:inline-block;background:#252a31;border-radius:30px;padding:6px 12px;font-size:12px;margin:5px 0}
.badge.good{background:#123d2a;color:#8ff0b4}
.badge.wait{background:#493818;color:#ffd47b}
.timeline{margin:25px 0 10px}
.step{display:flex;gap:14px;position:relative;padding-bottom:22px}
.step:not(:last-child):before{content:"";position:absolute;left:10px;top:22px;height:calc(100% - 12px);width:2px;background:#383c43}
.dot{width:22px;height:22px;flex-shrink:0;border-radius:50%;border:2px solid #555;background:#111;z-index:1}
.step.done .dot{background:#e82127;border-color:#e82127}
.step.current .dot{border-color:#e82127;box-shadow:0 0 10px #e8212770}
.step strong{font-size:13px}
.step p{color:#999;font-size:12px}
.note{background:#211a13;border-left:3px solid #e8a13a;padding:13px;margin-top:15px;font-size:13px;color:#eee}
.empty{color:#aaa;padding:20px 0}
button{background:#e82127;color:#fff;border:0;padding:12px 18px;border-radius:5px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
footer{text-align:center;color:#777;padding:25px;border-top:1px solid #333;font-size:12px}
@media(max-width:600px){main{margin:25px auto}.card{padding:16px}.details{grid-template-columns:1fr 1fr}h1{font-size:25px}}
</style>
</head>

<body>

<header>
 <div class="logo">TESLA <span>INNOVATION</span></div>
 <div style="display:flex;gap:18px;flex-wrap:wrap">
  <a href="customer.html">Customer Portal</a>
  <a href="vehicles.html">Showroom</a>
 </div>
</header>

<main>
 <h1>Global Order Tracking</h1>
 <p class="sub">Follow your vehicle order and view its latest delivery information.</p>

 <section class="card">
  <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
   <h2>Your Shipments</h2>
   <button id="refreshButton" onclick="loadOrders()">REFRESH</button>
  </div>
  <div id="orders">
   <p class="empty">Loading your orders...</p>
  </div>
 </section>
</main>

<footer>© 2026 TESLA Innovation. All rights reserved.</footer>

<script>
'use strict';

const SUPABASE_URL='https://dnmktpmvjzsxzmgizdcv.supabase.co';
const SUPABASE_KEY='sb_publishable_80ZPvReXfDaw0UhD872X4Q_Vz2xcrbj';

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ordersBox=document.getElementById('orders');

const stages=[
 'ORDER CONFIRMED',
 'PROCESSING',
 'DISPATCHED',
 'IN TRANSIT',
 'OUT FOR DELIVERY',
 'DELIVERED'
];

function normalizeStatus(value){
 return String(value||'')
  .trim()
  .toUpperCase()
  .replace(/_/g,' ')
  .replace(/-/g,' ');
}

function getStage(status){
 const value=normalizeStatus(status);

 return stages.findIndex(stage=>stage===value);
}

function safeText(value){
 return value===null||value===undefined||value===''
  ?'Not yet provided'
  :String(value);
}

function createElement(tag,className,text){
 const el=document.createElement(tag);
 if(className)el.className=className;
 if(text!==undefined)el.textContent=text;
 return el;
}

function addDetail(container,label,value){
 const box=createElement('div','detail');
 box.appendChild(createElement('small','',label));
 box.appendChild(createElement('strong','',safeText(value)));
 container.appendChild(box);
}

function createTimeline(status){
 const current=getStage(status);
 const timeline=createElement('div','timeline');

 stages.forEach((stage,index)=>{
  const row=createElement('div','step');

  if(current>=0&&index<current)row.classList.add('done');
  if(current===index)row.classList.add('current');
  if(current>=0&&index===current)row.classList.add('done');

  const dot=createElement('div','dot');
  const content=createElement('div');

  content.appendChild(createElement('strong','',stage));

  let description='Awaiting this delivery stage.';

  if(current>=0&&index<current){
   description='This stage has been completed.';
  }else if(current===index){
   description='Current order stage.';
  }else if(current>=0&&index>current){
   description='Upcoming delivery stage.';
  }

  if(current===-1){
   description='The order status is awaiting an update.';
  }

  content.appendChild(createElement('p','',description));

  row.appendChild(dot);
  row.appendChild(content);
  timeline.appendChild(row);
 });

 return timeline;
}

function verifiedPayment(value){
 return ['verified'].includes(
  String(value||'').trim().toLowerCase()
 );
}

function createOrderCard(order){
 const card=createElement('article','order');

 card.appendChild(createElement(
  'h2','',order.vehicle_name||'Vehicle order'
 ));

 const payment=String(order.payment_status||'pending');
 const verified=verifiedPayment(payment);

 const paymentBadge=createElement(
  'span',
  'badge '+(verified?'good':'wait'),
  'Payment: '+payment.toUpperCase()
 );

 card.appendChild(paymentBadge);

 if(!verified){
  card.appendChild(createElement(
   'p','empty',
   'Shipment tracking becomes available after your payment has been verified by our team.'
  ));
  return card;
 }

 const status=order.order_status||'Awaiting update';

 card.appendChild(createElement(
  'div','badge',
  'Order status: '+normalizeStatus(status)
 ));

 const details=createElement('div','details');

 addDetail(details,'Order reference',order.id);
 addDetail(details,'Delivery country',order.delivery_country);
 addDetail(details,'Shipping carrier',order.shipping_carrier);
 addDetail(details,'Tracking number',order.tracking_number);
 addDetail(details,'Estimated delivery',order.estimated_delivery);
 addDetail(details,'Last updated',order.updated_at
  ?new Date(order.updated_at).toLocaleString()
  :'Not yet updated');

 card.appendChild(details);
 card.appendChild(createTimeline(status));

 if(order.admin_note){
  const note=createElement('div','note');
  note.appendChild(createElement('strong','','Delivery update from our team'));
  note.appendChild(createElement('p','',order.admin_note));
  card.appendChild(note);
 }

 if(order.tracking_url){
  try{
   const url=new URL(order.tracking_url);

   if(url.protocol==='https:'||url.protocol==='http:'){
    const link=createElement('a','','OPEN CARRIER TRACKING →');
    link.href=url.href;
    link.target='_blank';
    link.rel='noopener noreferrer';
    link.style.display='inline-block';
    link.style.marginTop='18px';
    card.appendChild(link);
   }
  }catch(error){
   console.warn('Invalid tracking URL');
  }
 }

 return card;
}

async function loadOrders(){
 const button=document.getElementById('refreshButton');

 button.disabled=true;
 button.textContent='LOADING...';
 ordersBox.replaceChildren(
  createElement('p','empty','Loading your orders...')
 );

 try{
  const {data:{user},error:authError}=await db.auth.getUser();

  if(authError||!user){
   const returnTo=location.pathname+location.search;

   location.replace(
    'customer.html?returnTo='+encodeURIComponent(returnTo)
   );
   return;
  }

  const {data,error}=await db
   .from('customer_orders')
   .select(`
    id,
    vehicle_name,
    tracking_number,
    payment_status,
    order_status,
    delivery_country,
    shipping_carrier,
    tracking_url,
    estimated_delivery,
    admin_note,
    created_at,
    updated_at
   `)
   .eq('customer_id',user.id)
   .order('created_at',{ascending:false});

  if(error)throw error;

  ordersBox.replaceChildren();

  if(!data||data.length===0){
   ordersBox.appendChild(createElement(
    'p','empty',
    'No vehicle orders are currently linked to your account.'
   ));
   return;
  }

  data.forEach(order=>{
   ordersBox.appendChild(createOrderCard(order));
  });

 }catch(error){
  console.error(error);

  ordersBox.replaceChildren(
   createElement(
    'p','empty',
    'Unable to retrieve your tracking information. Please try again.'
   )
  );

 }finally{
  button.disabled=false;
  button.textContent='REFRESH';
 }
}

db.auth.onAuthStateChange((event)=>{
 if(event==='SIGNED_OUT'){
  location.replace('customer.html');
 }
});

loadOrders();
</script>

</body>
</html>
